# CLI manifest for the Wellbore DDMS service.
#
# Scope: every typed record resource, none of the bulk data. The nine resource types share
# one shape — create, get, soft-delete, list versions, get a version — so this manifest is
# nine copies of five commands, and the regularity is the point: a user who learns
# `welllog get` already knows `trajectory get`.
#
# What is deliberately outside the scope, and why:
#
#   * The 35 bulk data and session operations (`/data`, `/data/statistics`, `/sessions/*`).
#     Bulk IO is what a DDMS is for, but it is a different piece of work, not more of this
#     one: chunked upload is a multi-step session protocol, the payloads are columnar rather
#     than JSON records, and `--output table` is meaningless for a log curve. They are listed
#     individually under `exclude:` rather than left out of `scope:`, so that a new bulk
#     endpoint upstream fails the build as `missing` instead of passing as untriaged.
#
#   * `/about` and `/version` — service identity, which R5 puts in `osducs status`.
#
#   * `/log-recognition/*` — a catalog admin surface, not a record resource.
#
# One parameter is knowingly not exposed: `DELETE` on the four bulk-carrying types
# (welllogs, wellboretrajectories, ppfgdataset, wellpressuretestrawmeasurement) accepts a
# `purge` query flag, default false, which the spec documents with an empty description. The
# delete commands here are all soft deletes. Adding an irreversible flag whose exact effect
# the spec does not state — and which no confirmation guard would cover, R6 not being
# implemented yet — is not something to do by inference from its name.

service: wellbore_ddms
spec: wellbore_ddms
client: WellboreDdms
description: Wellbore DDMS — typed wellbore records.

# Every typed resource under /ddms/v3. The bulk operations inside these prefixes are claimed
# by `exclude:` below, not left unscoped.
scope:
  - "/ddms/v3/*"

groups:
  well: Manage Well records in the Wellbore DDMS.
  well version: Inspect Well record version history.
  wellbore: Manage Wellbore records in the Wellbore DDMS.
  wellbore version: Inspect Wellbore record version history.
  welllog: Manage WellLog records in the Wellbore DDMS.
  welllog version: Inspect WellLog record version history.
  trajectory: Manage WellboreTrajectory records in the Wellbore DDMS.
  trajectory version: Inspect WellboreTrajectory record version history.
  markerset: Manage WellboreMarkerSet records in the Wellbore DDMS.
  markerset version: Inspect WellboreMarkerSet record version history.
  intervalset: Manage WellboreIntervalSet records in the Wellbore DDMS.
  intervalset version: Inspect WellboreIntervalSet record version history.
  logacquisition: Manage WellLogAcquisition records in the Wellbore DDMS.
  logacquisition version: Inspect WellLogAcquisition record version history.
  ppfg: Manage PPFGDataset records in the Wellbore DDMS.
  ppfg version: Inspect PPFGDataset record version history.
  pressuretest: Manage WellPressureTestRawMeasurement records in the Wellbore DDMS.
  pressuretest version: Inspect WellPressureTestRawMeasurement record version history.

commands:

  # ---- Well ----------------------------------------------------------------
  - command: well get
    summary: Get a Well record by id.
    op: { method: get, path: "/ddms/v3/wells/{record_id}" }
    params:
      record_id: { flag: --id, short: -id, required: true, help: Well record id. }
    output: raw

  - command: well add
    summary: Add a Well record from a JSON file.
    op: { method: post, path: "/ddms/v3/wells" }
    body:
      flag: --file
      short: -f
      required: true
      help: JSON file containing the Well record.
      # The endpoint takes an array; users pass a single record file.
      wrap-single: true
    output:
      root: recordIds

  - command: well delete
    summary: Soft-delete a Well record by id.
    op: { method: delete, path: "/ddms/v3/wells/{record_id}" }
    params:
      record_id: { flag: --id, short: -id, required: true, help: Well record id to delete. }
    output:
      message: 1 record deleted

  - command: well version list
    summary: List all versions of a Well record.
    op: { method: get, path: "/ddms/v3/wells/{record_id}/versions" }
    params:
      record_id: { flag: --id, short: -id, required: true, help: Well record id. }
    output: raw

  - command: well version get
    summary: Get a specific version of a Well record.
    op: { method: get, path: "/ddms/v3/wells/{record_id}/versions/{version}" }
    params:
      record_id: { flag: --id, short: -id, required: true, help: Well record id. }
      version:   { flag: --version, short: -v, required: true, help: Well record version. }
    output: raw

