# CLI manifest for the Wellbore DDMS service.
#
# Scope: every typed record resource, plus reading their bulk data. The nine resource types
# share one record shape — create, get, soft-delete, list versions, get a version — so most
# of this manifest is nine copies of five commands, and the regularity is the point: a user
# who learns `welllog get` already knows `trajectory get`.
#
# The four types that carry bulk data (welllog, trajectory, ppfg, pressuretest) add reads of
# it: `<noun> data get` for the latest, `<noun> version data` for a specific version. These
# are ordinary paginated queries — offset, limit, column selection, row filters — and map
# onto the manifest vocabulary with nothing new.
#
# Writing bulk data is here too. `<noun> data add` sends one file as the whole bulk, or several
# through an upload session, which it opens, fills and commits itself; `<noun> data session`
# exposes the session's steps for doing them by hand, as the Python CLI did. Sending a file is
# hand-written (Commands/WellboreBulkWrite.cs): its body is JSON or Parquet, read from disk as
# it is. The rest of the session protocol is generated below.
#
# Also outside the scope: `/about` and `/version` (service identity, which R5 puts in
# `osducs status`) and `/log-recognition/*` (catalog admin, not a record resource).
#
# One parameter is knowingly not exposed: `DELETE` on the four bulk-carrying types accepts a
# `purge` query flag, default false, which the spec documents with an empty description. The
# delete commands here are all soft deletes. Inferring an irreversible flag's behaviour from
# its name is not a trade worth making, the confirmation guard (R6) notwithstanding.
#
# Bulk reads return JSON here. The endpoints also offer `application/x-parquet` by content
# negotiation, which would need binary output plumbing the CLI does not have yet.

service: wellbore_ddms
spec: wellbore_ddms
client: WellboreDdms
description: Wellbore DDMS — typed wellbore records.

# Nine typed resources would otherwise be nine of the twenty-two entries on the root help
# page, crowding out `record`, `schema` and `search`. They get their own section.
section: Wellbore DDMS

# Every typed resource under /ddms/v3. The bulk write operations inside these prefixes are
# claimed by `exclude:` below, not left unscoped.
scope:
  - "/ddms/v3/*"

groups:
  well: Manage Well records.
  well version: Inspect Well record version history.
  wellbore: Manage Wellbore records.
  wellbore version: Inspect Wellbore record version history.
  welllog: Manage WellLog records.
  welllog version: Inspect WellLog record version history.
  welllog data: Read and write WellLog bulk data.
  welllog data session: Send WellLog bulk data in chunks — open a session, send them, commit it.
  trajectory: Manage WellboreTrajectory records.
  trajectory version: Inspect WellboreTrajectory record version history.
  trajectory data: Read and write WellboreTrajectory bulk data.
  trajectory data session: Send WellboreTrajectory bulk data in chunks — open a session, send them, commit it.
  markerset: Manage WellboreMarkerSet records.
  markerset version: Inspect WellboreMarkerSet record version history.
  intervalset: Manage WellboreIntervalSet records.
  intervalset version: Inspect WellboreIntervalSet record version history.
  logacquisition: Manage WellLogAcquisition records.
  logacquisition version: Inspect WellLogAcquisition record version history.
  ppfg: Manage PPFGDataset records.
  ppfg version: Inspect PPFGDataset record version history.
  ppfg data: Read and write PPFGDataset bulk data.
  ppfg data session: Send PPFGDataset bulk data in chunks — open a session, send them, commit it.
  pressuretest: Manage WellPressureTestRawMeasurement records.
  pressuretest version: Inspect WellPressureTestRawMeasurement record version history.
  pressuretest data: Read and write WellPressureTestRawMeasurement bulk data.
  pressuretest data session: Send WellPressureTestRawMeasurement bulk data in chunks — open a session, send them, commit it.

commands:

  # ---- Well ----------------------------------------------------------------
  - command: well get
    summary: Get a Well record by id.
    op: { method: get, path: "/ddms/v3/wells/{record_id}" }
    params:
      record_id: { flag: --id, short: -id, required: true, help: Well record id. }
    output: raw

  - command: well add
    summary: Add a Well record from a JSON file.
    op: { method: post, path: "/ddms/v3/wells" }
    body:
      flag: --file
      short: -f
      required: true
      help: JSON file containing the Well record.
      # The endpoint takes an array; users pass a single record file.
      wrap-single: true
    output:
      root: recordIds

  - command: well delete
    summary: Soft-delete a Well record by id.
    op: { method: delete, path: "/ddms/v3/wells/{record_id}" }
    params:
      record_id: { flag: --id, short: -id, required: true, help: Well record id to delete. }
    confirm:
      message: >-
        Delete the record {record_id}. Records that refer to it are not deleted with it.
    output:
      message: 1 record deleted

  - command: well version list
    summary: List all versions of a Well record.
    op: { method: get, path: "/ddms/v3/wells/{record_id}/versions" }
    params:
      record_id: { flag: --id, short: -id, required: true, help: Well record id. }
    output: raw

  - command: well version get
    summary: Get a specific version of a Well record.
    op: { method: get, path: "/ddms/v3/wells/{record_id}/versions/{version}" }
    params:
      record_id: { flag: --id, short: -id, required: true, help: Well record id. }
      version:   { flag: --version, short: -v, required: true, help: Well record version. }
    output: raw

