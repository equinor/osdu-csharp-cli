# CLI manifest for the OSDU Search service.
#
# Search contributes to the `record` noun rather than owning one of its own: what it returns
# are records, and `osdu record search` sits beside `osdu record list` so the two ways of
# finding a record are next to each other in help. The Python CLI splits them across
# `osdu search query` and `osdu storage list`, which puts the alternatives in different
# parts of the tree. See COMMAND-GRAMMAR.md.

service: search
spec: search
client: Search
description: Search service — full-text and structured queries across records.

groups:
  record: Work with records — the kind-agnostic unit of OSDU data. Search lives here.

commands:
  # The one command most OSDU CLI users run. Its body is assembled from options rather than
  # read from a JSON file: requiring `--file query.json` for the commonest operation in the
  # tool would be a real regression against the Python CLI.
  - command: record search
    summary: Search records with a Lucene query.
    op: { method: post, path: /query }
    body:
      fields:
        kind:
          flag: --kind
          short: -k
          required: true
          help: >
            Kind to search. Wildcards are allowed per segment, so
            "osdu:wks:master-data--Well:*" covers every schema version — pinning one
            silently misses records written against the others.
        query:
          flag: --query
          short: -q
          help: >
            Lucene query string, e.g. data.FacilityName:GB* for a prefix, or
            data.FacilityName:"GB 211/23-A8" for an exact phrase. Omit to match
            everything of this kind.
        limit:
          flag: --limit
          type: int
          help: Maximum number of results. Defaults to 10 upstream, capped at 1000.
        offset:
          flag: --offset
          type: int
          help: Number of results to skip. Use --cursor-based paging beyond 10000.
        sort.field:
          flag: --sort-by
          type: string[]
          help: >
            Fields to sort by, e.g. id or data.FacilityName. Pair positionally with
            --sort-order.
        sort.order:
          flag: --sort-order
          type: string[]
          help: Sort direction per --sort-by field. Defaults to ASC upstream when omitted.
        trackTotalCount:
          flag: --track-total-count
          type: bool
          help: >
            Report the true match count. Without it the count is capped at 10000, which
            silently understates any large kind.
        returnedFields:
          flag: --returned-fields
          short: -f
          type: string[]
          help: >
            Fields to project, e.g. id, data.FacilityName. Repeat the flag or comma-separate.
            These become the table columns, so asking for a field shows it. Server-side, so
            it also cuts what crosses the wire.
        excludedFields:
          flag: --excluded-fields
          short: -x
          type: string[]
          help: >
            Fields to omit, e.g. data.rawData — everything else is returned. The inverse of
            --returned-fields and cannot be combined with it. Columns stay Id and Kind
            unless --returned-fields names others, since an exclusion says nothing about
            what to show.
        spatialFilter.field:
          flag: --spatial-field
          help: >
            Geo-point field to filter on. Required with --bbox or --near; the OSDU
            convention is data.SpatialLocation.Wgs84Coordinates.
        spatialFilter.byBoundingBox:
          flag: --bbox
          type: double[]
          parts:
            - spatialFilter.byBoundingBox.topLeft.latitude
            - spatialFilter.byBoundingBox.topLeft.longitude
            - spatialFilter.byBoundingBox.bottomRight.latitude
            - spatialFilter.byBoundingBox.bottomRight.longitude
          help: >
            Bounding box as TOPLAT,TOPLON,BOTTOMLAT,BOTTOMLON — note top-left first, so
            the latitudes descend. Example: 49.1,7.7,48.8,8.0.
        spatialFilter.byDistance.point:
          flag: --near
          type: double[]
          parts:
            - spatialFilter.byDistance.point.latitude
            - spatialFilter.byDistance.point.longitude
          help: 'Centre point as LAT,LON, e.g. 48.935251,7.865344. Pair with --within.'
        spatialFilter.byDistance.distance:
          flag: --within
          type: double
          help: Radius in metres around --near.
    mutually-exclusive:
      - [returnedFields, excludedFields]
      - [spatialFilter.byBoundingBox, spatialFilter.byDistance.point]
    examples:
      - --kind "osdu:wks:master-data--Well:*" --limit 5
      - --kind "osdu:wks:master-data--Well:*" --limit 3 -x data.GeoContexts -x data.NameAliases
      - args: --kind "osdu:wks:master-data--Well:*" --spatial-field data.SpatialLocation.Wgs84Coordinates --bbox 49.1,7.7,48.8,8.0 --limit 3 -f id -f data.FacilityName
        skip: >
          Geographic examples depend on where an instance holds data; this box covers
          Alsace, which is populated on dev but need not be elsewhere.
      - args: --kind "osdu:wks:master-data--Well:*" --spatial-field data.SpatialLocation.Wgs84Coordinates --near 48.935251,7.865344 --within 50000 --limit 3 -f id -f data.FacilityName
        skip: >
          As above — a radius around a point that has wells on dev.
      - --kind "osdu:wks:master-data--Well:*" --query 'data.FacilityName:GB*' --limit 5
      - --kind "osdu:wks:master-data--Well:*" --query 'data.FacilityName:"GB 211/23-A8"'
      - --kind "osdu:wks:master-data--Well:*" --limit 5 -f id -f data.FacilityName
      - --kind "osdu:wks:master-data--Well:*" --limit 5 --sort-by id --sort-order DESC
      - --kind "osdu:wks:master-data--Well:*" --limit 1 --track-total-count
    output:
      root: results
      # totalCount sits beside results, outside the projection root, so it would otherwise
      # be discarded — leaving --track-total-count with nothing to show.
      total-from: totalCount
      # Projected fields become the columns; without this the fixed Id/Kind pair would be
      # rendered and the fields the user asked for would be fetched and then hidden.
      columns-from: returnedFields
      columns:
        Id: id
        Kind: kind

  # Same POST /query as `record search`, but a different question and a different answer
  # shape: "how many of each" rather than "which ones". Setting aggregateBy on `search`
  # would have been worse than a separate command — the service returns records *and*
  # aggregations, so the table would show the records and quietly discard the counts the
  # user asked for.
  - command: record aggregate
    summary: Count distinct values of a field across matching records.
    op: { method: post, path: /query }
    body:
      fields:
        kind:
          flag: --kind
          short: -k
          required: true
          help: Kind to aggregate over. Wildcards allowed per segment.
        aggregateBy:
          flag: --by
          short: -b
          required: true
          help: >
            Field to count distinct values of, e.g. kind. Only fields indexed as
            keywords can be aggregated; others answer "Aggregations are not supported
            for one or more of the specified fields".
        query:
          flag: --query
          short: -q
          help: 'Lucene query to narrow what is counted, e.g. data.FacilityName:GB*.'
    examples:
      - --kind "osdu:wks:master-data--*:*" --by kind
      - --kind "osdu:wks:master-data--Well:*" --by kind --query 'data.FacilityName:GB*'
    output:
      root: aggregations
      columns:
        Value: key
        Count: count

exclude:
  - op: { method: post, path: /query_with_cursor }
    reason: >
      Cursor paging is the same query with a different result envelope, so it cannot share
      a command with POST /query while one command means one operation. Exposing it as a
      second command (`record search-cursor`) would put the paging mechanism in the command
      name. Blocked on the generator growing a `variants:` mechanism — COMMAND-GRAMMAR.md
      §3.1, the same gap that affects 24 operations across unit, crs and dataset.
  - op: { method: delete, path: "/query_with_cursor/{cursor}" }
    reason: Releases a cursor obtained from query_with_cursor, which is excluded.
  - op: { method: get, path: /readiness_check }
    reason: Infrastructure probe, covered by `osdu status`.
  - op: { method: get, path: /liveness_check }
    reason: Infrastructure probe, covered by `osdu status`.

handwritten:
  - command: status
    op: { method: get, path: /info }
    reason: >
      Reported by `osdu status`, which probes every service's /info in one command rather
      than giving each service its own. See cli-manifest/storage.yaml for the rationale.
