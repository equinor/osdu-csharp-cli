name: cli

on: [push, pull_request]

jobs:
  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: osdu-csharp-cli }

      # The generator reads specs from the client repo next to this one.
      - uses: actions/checkout@v4
        with: { repository: equinor/osdu-csharp-client, path: osdu-csharp-client }

      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - run: pip install pyyaml

      # Fails when an upstream endpoint is neither mapped, hand-written nor excluded —
      # a new OSDU endpoint shows up here by name instead of silently going missing.
      - name: Check manifests against specs
        working-directory: osdu-csharp-cli
        run: python3 tools/generate_cli.py --check

      # Fails when the committed generated code is stale.
      - name: Check generated code is up to date
        working-directory: osdu-csharp-cli
        run: |
          python3 tools/generate_cli.py
          git diff --exit-code -- src/OsduCli/Commands/Generated

  build:
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest,  rid: linux-x64 }
          - { os: windows-latest, rid: win-x64 }
          - { os: macos-latest,   rid: osx-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with: { path: osdu-csharp-cli }
      - uses: actions/checkout@v4
        with: { repository: equinor/osdu-csharp-client, path: osdu-csharp-client }
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }

      # osdu-csharp-client gitignores its generated Kiota code, so a fresh checkout has
      # none and anything referencing the client fails to compile. Generate it first.
      - name: Generate the client
        working-directory: osdu-csharp-client
        run: |
          dotnet tool install --global Microsoft.OpenApi.Kiota
          pip install pyyaml
          python3 generate_all.py

      - name: Test
        working-directory: osdu-csharp-cli
        run: dotnet test

      # NativeAOT cannot cross-compile, which is why this is a matrix and not one job.
      - name: Publish
        working-directory: osdu-csharp-cli/src/OsduCli
        run: dotnet publish -c Release -r ${{ matrix.rid }} --self-contained -p:PublishSingleFile=true
