name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  release-please:
    name: Release Please
    if: github.event_name == 'push'
    permissions:
      contents: write # Required to update changelog file
      pull-requests: write # Required to create release PRs
    uses: equinor/ops-actions/.github/workflows/release-please-manifest.yml@4b9451c480b4b8632730c9cbc2f8d13e7a852259 # v9.42.0

  test:
    name: Test
    needs: release-please
    if: ${{ always() && (github.event_name == 'workflow_dispatch' || needs.release-please.outputs.releases_created == 'true') }}
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/run-tests.yml

  # One job per platform because a self-contained build has to run on the platform it
  # targets. Each uploads its own archive to the release created above.
  publish:
    name: Publish ${{ matrix.rid }}
    needs: [release-please, test]
    # needs.test must have succeeded — never publish a binary whose tests did not pass.
    if: ${{ always() && needs.test.result == 'success' && (github.event_name == 'workflow_dispatch' || needs.release-please.outputs.releases_created == 'true') }}
    strategy:
      # One platform failing should not hide whether the others built.
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, rid: linux-x64, archive: tar.gz, bin: osducs }
          - { os: windows-latest, rid: win-x64, archive: zip, bin: osducs.exe }
          - { os: macos-latest, rid: osx-arm64, archive: tar.gz, bin: osducs }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write # Required to attach assets to the release
      packages: read # Equinor.OsduCsharpClient comes from GitHub Packages
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.x"

      # GitHub Packages requires authentication even for public packages.
      # shell: bash matters — the default on Windows runners is pwsh, where ${GITHUB_TOKEN}
      # is PowerShell variable syntax and expands to nothing, giving a blank password and a
      # 401 that looks like a permissions problem rather than a shell one.
      - name: Authenticate to GitHub Packages
        shell: bash
        run: >
          dotnet nuget update source equinor-github
          --username ${{ github.actor }}
          --password ${GITHUB_TOKEN}
          --store-password-in-clear-text
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Self-contained, not NativeAOT. AOT would be ~8 MB with near-instant startup, but as
      # measured it does not work, and every blocker is in Equinor.OsduCsharpClient:
      # OsduConfig's `required` and `init` members defeat the source-generated config binder,
      # and OsduClient creates service clients with Activator.CreateInstance, which trimming
      # breaks. Fixing either changes the client's public API, so it is the client's call.
      # ~80 MB per platform is the cost of needing no .NET runtime on the machine.
      - name: Publish
        working-directory: src/OsduCli
        run: >
          dotnet publish --configuration Release
          --runtime ${{ matrix.rid }}
          --self-contained
          -p:PublishSingleFile=true
          -p:DebugType=none
          --output publish

      - name: Archive (tar.gz)
        if: matrix.archive == 'tar.gz'
        run: tar -czf osducs-${{ matrix.rid }}.tar.gz -C src/OsduCli/publish osducs

      - name: Archive (zip)
        if: matrix.archive == 'zip'
        run: Compress-Archive -Path src/OsduCli/publish/osducs.exe -DestinationPath osducs-${{ matrix.rid }}.zip
        shell: pwsh

      # Lets someone who has downloaded a binary check it matches this release entry: not
      # truncated, not corrupted, not another version. It does not show the file came from
      # us — whoever could replace the asset could replace this beside it — which needs a
      # signature. Both hashes are recorded: the archive's, and the binary's inside it, the
      # latter because that is what a Windows audit reports, and comparing it meant
      # rebuilding the archive by hand until now.
      - name: Checksums
        shell: bash
        run: |
          archive="osducs-${{ matrix.rid }}.${{ matrix.archive }}"
          bin="${{ matrix.bin }}"
          # sha256sum on Linux and Git Bash, shasum on macOS. Neither is on all three.
          sha256() {
            if command -v sha256sum >/dev/null 2>&1; then sha256sum "$1"; else shasum -a 256 "$1"; fi
          }
          # Assigned rather than substituted straight into printf: printf succeeds whatever
          # the substitution did, so a failed hash would publish an empty digest. In an
          # assignment the failure is the assignment's, and -e stops the release.
          archive_sha="$(sha256 "$archive" | cut -d' ' -f1)"
          bin_sha="$(sha256 "src/OsduCli/publish/$bin" | cut -d' ' -f1)"
          for sha in "$archive_sha" "$bin_sha"; do
            [[ $sha =~ ^[0-9a-f]{64}$ ]] || { echo "not a sha256 digest: '$sha'" >&2; exit 1; }
          done
          {
            printf '%s  %s\n' "$archive_sha" "$archive"
            printf '%s  %s\n' "$bin_sha" "$bin"
          } > "$archive.sha256"
          cat "$archive.sha256"

      # equinor/ops-actions exposes `path_tag_names` — a JSON object of path -> tag — and
      # no plain `tag_name`. Reading the wrong key gave an empty tag and a "release not
      # found" upload against a release that had just been created successfully.
      # Falls back to the latest release so a manual re-run can attach assets too.
      - name: Resolve the release tag
        id: release
        shell: bash
        env:
          PATH_TAG_NAMES: ${{ needs.release-please.outputs.path_tag_names }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag=$(printf '%s' "${PATH_TAG_NAMES:-}" | jq -r '.["."] // empty' 2>/dev/null || true)
          if [ -z "$tag" ]; then
            tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          fi
          echo "Attaching to $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Attach to release
        shell: bash
        run: |
          gh release upload "${TAG}" \
            "osducs-${{ matrix.rid }}.${{ matrix.archive }}" \
            "osducs-${{ matrix.rid }}.${{ matrix.archive }}.sha256" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
